plugins {
    alias libs.plugins.android.library
    // AGP 9 起 Kotlin 支持内置，不能再应用 org.jetbrains.kotlin.android
    // （应用会直接抛 "no longer required for Kotlin support since AGP 9.0"）
    alias libs.plugins.ksp
    alias libs.plugins.kotlin.parcelize
    alias libs.plugins.kotlin.serialization
    id 'maven-publish'
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

android {
    namespace 'io.horizontalsystems.marketkit'
    compileSdk 36

    defaultConfig {
        minSdk 26

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 9 移除了 android.kotlinOptions，jvmTarget 统一在顶层 kotlin { compilerOptions } 里设置
    testOptions {
        targetSdk 36
    }
    lint {
        targetSdk 36
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    //Room
    implementation libs.room.runtime
    // kapt 在 AGP 9 下已不适用，Room 注解处理统一走 KSP
    ksp(libs.androidx.room.compiler)

    //Coroutines
    api libs.kotlinx.coroutines.android

    //Retrofit
    implementation libs.retrofit.lib
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp.logging.interceptor
    implementation libs.retrofit.converter.scalars
    implementation libs.google.gson
    implementation libs.kotlinx.serialization.json

}
